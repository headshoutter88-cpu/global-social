<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLOBAL SOCIAL | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar admin-topbar">
      <div class="container nav-wrap">
        <div class="brand-wrap">
          <div class="brand-mark">GS</div>
          <div>
            <p class="brand-name">GLOBAL SOCIAL</p>
          </div>
        </div>
        <div class="nav-actions">
          <a href="index.html" class="link-btn">Storefront</a>
        </div>
      </div>
    </header>

    <main class="admin-shell container">
      <section class="admin-card">
        <div class="section-heading compact">
          <div>
            <p class="section-tag">Admin Access</p>
            <h2>Dashboard</h2>
          </div>
          <div class="admin-badge">Admin: alfarhabiridoy@gmail.com</div>
        </div>

        <div class="admin-grid">
          <div class="panel">
            <h3>Add / Edit Product</h3>
            <form id="productForm" class="product-form">
              <input type="hidden" id="productId" />
              <label>
                Product name
                <input type="text" id="productName" required />
              </label>
              <label>
                Category
                <select id="productCategory" required>
                  <option value="Toys">Toys</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Fashion">Fashion</option>
                  <option value="Home">Home</option>
                  <option value="Beauty">Beauty</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </label>
              <label>
                Price ($)
                <input type="number" id="productPrice" min="1" step="0.01" required />
              </label>
              <label>
                Image URL
                <input type="url" id="productImage" required />
              </label>
              <label>
                Description
                <textarea id="productDescription" rows="3" required></textarea>
              </label>
              <div class="form-actions">
                <button type="submit" class="primary-btn">Save Product</button>
                <button type="button" id="resetProductForm" class="secondary-btn">Reset</button>
              </div>
            </form>
          </div>

          <div class="panel">
            <h3>Inventory Summary</h3>
            <div id="inventoryStats" class="stats-box"></div>
          </div>
        </div>
      </section>

      <section class="admin-card">
        <div class="section-heading compact">
          <div>
            <p class="section-tag">Operations</p>
            <h2>Products</h2>
          </div>
        </div>
        <div id="adminProductList" class="admin-product-list"></div>
      </section>

      <section class="admin-card">
        <div class="section-heading compact">
          <div>
            <p class="section-tag">Orders</p>
            <h2>Track order status</h2>
          </div>
        </div>
        <div id="adminOrders" class="admin-orders"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
